# =============================================================================
# BtLegrand X8000 — "API Budget & Diagnostics" dashboard VIEW
# =============================================================================
# A ready-made Home Assistant *Sections* view for the integration's diagnostic
# sensors, both live and historical. It follows the exact structure the HA UI
# produces: a `type: sections` view whose `sections:` are `type: grid` cards,
# with side-by-side cards grouped in `horizontal-stack` and full-width cards
# forced with `grid_options: {columns: 36, rows: auto}` (each section spans the
# view's 3 columns -> its internal grid is 12 x 3 = 36 columns wide).
#
# PREREQUISITES
#   1. ApexCharts Card (HACS): https://github.com/RomRider/apexcharts-card
#   2. The two helper sensors from `diagnostics_templates.yaml` (for the gauges).
#   3. Recorder + long-term statistics enabled (default in HA). The 30-day charts
#      read HA statistics, so they populate from the moment stats start; the
#      "today" charts read state history and are immediate.
#
# HOW TO ADD
#   Dashboard -> ⋮ "Edit dashboard" -> ⋮ "Raw configuration editor" -> paste
#   this whole block as a new item under the top-level `views:` list.
#
# ENTITY IDS  (assume the default service-device name "BtLegrand Service";
#   verify under Developer Tools -> States, filter "btlegrand")
#     sensor.btlegrand_service_api_call_count        (total_increasing, resets @midnight)
#     sensor.btlegrand_service_projected_daily_calls (measurement)
#     sensor.btlegrand_service_polling_tier          (enum: disabled/normal/economy/survival/frozen)
#     sensor.btlegrand_service_smart_polling_skips   (total_increasing)
#     number.btlegrand_service_daily_api_quota       (tunable quota)
#     sensor.btlegrand_api_budget_used               (helper, from templates file)
#     sensor.btlegrand_api_projected_used            (helper, from templates file)
#   PER-DEVICE usage (sensor.<thermostat>_api_usage) is intentionally NOT charted
#   here: it reads better as native tiles you drop into the view per thermostat.
# =============================================================================

type: sections
max_columns: 3
title: BtLegrand — Diagnostica API
path: btlegrand-diagnostica
icon: mdi:cloud-sync
sections:
  # ========================================================= SECTION: TODAY ==
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading_style: title
        heading: Oggi, a colpo d'occhio
        icon: mdi:cloud-sync

      # --- Two quota gauges side by side (budget used / projected) ---------
      - type: horizontal-stack
        grid_options:
          columns: 36
          rows: auto
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Budget usato oggi
              show_states: true
            chart_type: radialBar
            series:
              - entity: sensor.btlegrand_api_budget_used
                name: Usato
                min: 0
                max: 100
                color_threshold:
                  - value: 0
                    color: "#43a047"   # green
                  - value: 80
                    color: "#fbc02d"   # amber  (< 20% budget left -> economy)
                  - value: 92
                    color: "#fb8c00"   # orange (< 8% budget left  -> survival)
                  - value: 100
                    color: "#e53935"   # red    (over quota)
            apex_config:
              chart:
                height: 220
              plotOptions:
                radialBar:
                  startAngle: -120
                  endAngle: 120
                  hollow:
                    size: 55%
                  track:
                    background: "rgba(128,128,128,0.15)"
                  dataLabels:
                    name:
                      show: true
                      fontSize: "12px"
                    value:
                      fontSize: "22px"
                      formatter: EVAL:function (v) { return Math.round(v) + '%'; }
          - type: custom:apexcharts-card
            header:
              show: true
              title: Proiezione a mezzanotte
              show_states: true
            chart_type: radialBar
            series:
              - entity: sensor.btlegrand_api_projected_used
                name: Proiezione
                min: 0
                max: 100
                color_threshold:
                  - value: 0
                    color: "#43a047"
                  - value: 90
                    color: "#fbc02d"
                  - value: 100
                    color: "#e53935"   # projected over quota = on pace to overshoot
            apex_config:
              chart:
                height: 220
              plotOptions:
                radialBar:
                  startAngle: -120
                  endAngle: 120
                  hollow:
                    size: 55%
                  track:
                    background: "rgba(128,128,128,0.15)"
                  dataLabels:
                    name:
                      show: true
                      fontSize: "12px"
                    value:
                      fontSize: "22px"
                      formatter: EVAL:function (v) { return Math.round(v) + '%'; }

      # --- Two native tiles side by side (current tier / skips) ------------
      - type: horizontal-stack
        grid_options:
          columns: 36
          rows: auto
        cards:
          - type: tile
            entity: sensor.btlegrand_service_polling_tier
            name: Polling Tier
            icon: mdi:speedometer
            color: >-
              {{ {'disabled':'grey','normal':'green','economy':'amber',
                  'survival':'orange','frozen':'red'}[states('sensor.btlegrand_service_polling_tier')] }}
            features_position: bottom
            vertical: false
          - type: tile
            entity: sensor.btlegrand_service_smart_polling_skips
            name: Poll risparmiati
            icon: mdi:leaf
            color: green

  # ================================================= SECTION: TODAY DYNAMICS ==
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading_style: title
        heading: Dinamica di oggi
        icon: mdi:chart-timeline-variant

      # --- Polling-tier TIMELINE (enum mapped to throttle depth 0..4) ------
      - type: custom:apexcharts-card
        grid_options:
          columns: 36
          rows: auto
        header:
          show: true
          title: Polling Tier — timeline
        graph_span: 24h
        span:
          start: day
        yaxis:
          - min: 0
            max: 4
            decimals: 0
            apex_config:
              tickAmount: 4
              labels:
                formatter: >-
                  EVAL:function (v) { return ['off','normal','eco','surv','frozen'][Math.round(v)] || ''; }
        apex_config:
          chart:
            height: 240
        series:
          - entity: sensor.btlegrand_service_polling_tier
            name: Tier
            type: area
            curve: stepline
            stroke_width: 2
            # Map the categorical state to a numeric "throttle depth". If this
            # lane renders empty, your tier states differ from the defaults.
            transform: >-
              return {'disabled':0,'normal':1,'economy':2,'survival':3,'frozen':4}[x];
            color_threshold:
              - value: 0
                color: "#9e9e9e"
              - value: 1
                color: "#43a047"
              - value: 2
                color: "#fbc02d"
              - value: 3
                color: "#fb8c00"
              - value: 4
                color: "#e53935"

      # --- Projected & used vs the live quota line (today) -----------------
      - type: custom:apexcharts-card
        grid_options:
          columns: 36
          rows: auto
        header:
          show: true
          title: Proiezione & uso vs quota (oggi)
          show_states: true
        graph_span: 24h
        span:
          start: day
        yaxis:
          - min: 0
            decimals: 0
        apex_config:
          chart:
            height: 240
        series:
          - entity: sensor.btlegrand_service_projected_daily_calls
            name: Proiezione
            type: area
            curve: smooth
            stroke_width: 2
            opacity: 0.15
            color: "#42a5f5"
          - entity: sensor.btlegrand_service_api_call_count
            name: Usate finora
            type: line
            curve: stepline
            stroke_width: 2
            color: "#7e57c2"
          # Flat quota line generated from the live number entity (quota-aware,
          # independent of recorder retention). `entity` is required by
          # apexcharts-card even for data_generator series; its own history is
          # ignored — the flat quota line comes from the generator.
          - entity: number.btlegrand_service_daily_api_quota
            name: Quota
            type: line
            stroke_width: 2
            color: "#e53935"
            show:
              legend_value: false
            data_generator: |
              const q = Number(hass.states['number.btlegrand_service_daily_api_quota'].state) || 500;
              return [[start.getTime(), q], [end.getTime(), q]];

  # ==================================================== SECTION: HISTORY 30d ==
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading_style: title
        heading: Storico — ultimi 30 giorni
        icon: mdi:chart-bar

      # --- Calls per day vs quota (HA statistics: change/day) --------------
      - type: custom:apexcharts-card
        grid_options:
          columns: 36
          rows: auto
        header:
          show: true
          title: Chiamate API al giorno
        graph_span: 30d
        yaxis:
          - min: 0
            decimals: 0
        apex_config:
          chart:
            height: 240
        series:
          - entity: sensor.btlegrand_service_api_call_count
            name: Chiamate/giorno
            type: column
            statistics:
              type: change
              period: day
            color: "#5c6bc0"
          # `entity` required even for data_generator series; history is ignored.
          - entity: number.btlegrand_service_daily_api_quota
            name: Quota
            type: line
            stroke_width: 2
            color: "#e53935"
            show:
              legend_value: false
            data_generator: |
              const q = Number(hass.states['number.btlegrand_service_daily_api_quota'].state) || 500;
              return [[start.getTime(), q], [end.getTime(), q]];

      # --- Skips per day (efficiency trend) --------------------------------
      - type: custom:apexcharts-card
        grid_options:
          columns: 36
          rows: auto
        header:
          show: true
          title: Poll risparmiati al giorno
        graph_span: 30d
        yaxis:
          - min: 0
            decimals: 0
        apex_config:
          chart:
            height: 240
        series:
          - entity: sensor.btlegrand_service_smart_polling_skips
            name: Skip/giorno
            type: column
            statistics:
              type: change
              period: day
            color: "#66bb6a"
cards: []
